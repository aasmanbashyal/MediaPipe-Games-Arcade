<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fruit Ninja — Advik's Games</title>
    <meta name="description" content="Slice flying fruits with your hands in this hand-tracking game!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/game-base.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="game.js"></script>
</head>

<body>
    <div class="game-container">
        <div class="rotate-overlay">
            <div class="rotate-icon">📱</div>
            <p class="rotate-text">Rotate to landscape</p>
            <p class="rotate-subtext">This game is designed for landscape mode</p>
        </div>
        <div id="miniViewContainer">
            <video id="webcamView" autoplay playsinline></video>
            <canvas id="miniCanvas"></canvas>
        </div>
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hudOverlay" class="hud-layer" style="display: none;">
            <div id="scoreBox"><span class="score-label">SCORE</span><span id="scoreDisplay">0</span></div>
            <div id="comboBox"><span class="combo-prefix">x</span><span id="comboDisplay">0</span><span
                    class="combo-label">COMBO</span></div>
            <div id="timerBox"><span id="timerDisplay">60</span><span class="timer-label">SEC</span></div>
        </div>

        <!-- Menu -->
        <div id="uiOverlay" class="ui-layer">
            <div class="ui-content">
                <a href="../../index.html" class="back-link">← BACK TO ARCADE</a>
                <h1 id="screenTitle">FRUIT NINJA</h1>
                <p class="tagline" id="taglineText">Swipe to slice flying fruits</p>
                <div class="difficulty-select" id="diffSelect">
                    <button class="diff-card" data-diff="classic"><span class="diff-icon">🍉</span><span
                            class="diff-name">Classic</span><span class="diff-desc">60 sec · Slice
                            everything</span></button>
                    <button class="diff-card" data-diff="zen"><span class="diff-icon">🧘</span><span
                            class="diff-name">Zen</span><span class="diff-desc">No bombs · Chill mode</span></button>
                </div>
                <div id="resultsPanel" style="display: none;">
                    <div class="result-row"><span class="result-label">Score</span><span id="finalScore"
                            class="result-value">0</span></div>
                    <div class="result-row"><span class="result-label">Fruits Sliced</span><span id="finalSliced"
                            class="result-value">0</span></div>
                    <div class="result-row"><span class="result-label">Max Combo</span><span id="finalCombo"
                            class="result-value">0</span></div>
                    <button id="playAgainBtn" class="play-again-btn">PLAY AGAIN</button>
                </div>
                <p id="statusText" class="status-text">Loading AI...</p>
            </div>
        </div>
    </div>
</body>

</html>
