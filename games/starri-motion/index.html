<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Starri Motion — Advik's Games</title>
    <meta name="description" content="A rhythm game powered by hand tracking AI.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/game-base.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="game.js"></script>
</head>

<body>
    <div class="game-container">
        <div id="miniViewContainer">
            <video id="webcamView" autoplay playsinline muted aria-label="Camera preview"></video>
            <canvas id="miniCanvas" aria-hidden="true"></canvas>
        </div>
        <canvas id="gameCanvas" aria-label="Game area"></canvas>

        <!-- HUD -->
        <div id="hudOverlay" class="hud-layer" style="display: none;">
            <div id="progressContainer">
                <div id="progressBar"></div>
            </div>
            <div id="scoreBox">
                <span class="score-label">SCORE</span>
                <span id="scoreDisplay">0</span>
            </div>
            <div id="comboBox">
                <span class="combo-prefix">x</span><span id="comboDisplay">0</span>
                <span class="combo-label">COMBO</span>
            </div>
            <div id="hitFeedback"></div>
        </div>

        <!-- Calibration -->
        <div id="calibrationOverlay" style="display: none;">
            <div class="calibration-content">
                <h2 id="calibrationTitle">GET READY</h2>
                <p id="calibrationHint">Place your hand in the circle</p>
                <canvas id="calibrationRing" width="200" height="200"></canvas>
                <div id="countdownDisplay" style="display: none;"></div>
            </div>
        </div>

        <!-- Start / Results -->
        <div id="uiOverlay" class="ui-layer">
            <div class="ui-content">
                <a href="../../index.html" class="back-link">← BACK TO ARCADE</a>
                <h1 id="screenTitle">STARRI MOTION</h1>
                <p class="tagline" id="taglineText">Move your hands to the rhythm</p>
                <div id="levelSelect" class="level-select">
                    <button class="level-card" data-level="easy">
                        <span class="level-icon">✦</span>
                        <span class="level-name">Easy</span>
                        <span class="level-desc">Slow & chill</span>
                    </button>
                    <button class="level-card" data-level="medium">
                        <span class="level-icon">✦✦</span>
                        <span class="level-name">Medium</span>
                        <span class="level-desc">Feel the beat</span>
                    </button>
                    <button class="level-card" data-level="hard">
                        <span class="level-icon">✦✦✦</span>
                        <span class="level-name">Hard</span>
                        <span class="level-desc">Pure fire</span>
                    </button>
                </div>
                <div id="resultsPanel" style="display: none;">
                    <div class="result-row"><span class="result-label">Score</span><span id="finalScore"
                            class="result-value">0</span></div>
                    <div class="result-row"><span class="result-label">Max Combo</span><span id="finalMaxCombo"
                            class="result-value">0</span></div>
                    <div class="result-row"><span class="result-label">Perfects</span><span id="finalPerfects"
                            class="result-value">0</span></div>
                    <div class="result-row"><span class="result-label">Rating</span><span id="finalRating"
                            class="result-value">—</span></div>
                    <button id="playAgainBtn" class="play-again-btn">PLAY AGAIN</button>
                </div>
                <p id="statusText" class="status-text">Choose controls to get started</p>
            </div>
        </div>

    </div>
</body>

</html>
